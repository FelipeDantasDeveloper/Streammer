name: Publicar no GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: Streammer/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: ./Streammer

      - name: Gerar o site
        run: npm run build
        working-directory: ./Streammer

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./Streammer/dist

      - uses: actions/deploy-pages@v4